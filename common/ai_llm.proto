// 아이템 상세 정보 (간식, 물품 등)
message ItemInfo {
  string item_name = 1;         // 물품명 (DB 매칭용)
  int32 quantity = 2;           // 수량
}

// 구조화된 응답 메시지
message StructuredResponse {
  string req_id = 1;                    // 요청 ID
  TaskType task_type = 2;               // 작업 유형
  float confidence = 3;                 // 신뢰도 (0.0 ~ 1.0)
  StructuredMessage struct_msg = 4;     // 구조화된 메시지
  string raw_text = 5;                  // 원본 텍스트 (디버깅용)
}

// 구조화된 메시지 (작업 종류별 필드)
message StructuredMessage {
  // 공통 및 레거시 필드
  optional string location = 1;         // 목적지/장소 (일반적 의미)
  // optional string item = 2;          // (Deprecated) 단일 아이템 이름 -> items 사용 권장
  
  // 시나리오 필수 사용자 정보
  optional string requester_name = 10;  // 요청자 이름 (User DB 매칭)
  optional string receiver_name = 11;   // 수신자 이름 (User DB 매칭, ITEM_DELIVERY 시)
  optional string visitor_name = 12;    // 방문객 이름 (GUIDE_GUEST 시)

  // 배달 및 이동 관련
  optional string source_location = 5;  // 출발지 (명시적 지정 시)
  optional string dest_location = 6;    // 목적지 (명시적 지정 시)
  repeated ItemInfo items = 7;          // 다중 아이템 목록
  
  // // IoT 제어 관련 (미사용)
  // optional IoTDeviceType device_type = 8;     // 장치 타입
  // optional IoTCommandType command = 9;        // 명령
  // optional float target_value = 10;           // 목표 값 (온도 등)
  // optional string room_id = 11;               // 방 ID
  
  // 기타 메시지
  optional string message = 19;         // 부가 메시지
  repeated string keywords = 20;        // 키워드 목록
}
