# Pinky Pro 통합 설정 파일
# 모든 노드의 파라미터를 여기서 관리합니다.

/**:
  ros__parameters:
    # --- 1. 통신 및 호스트 설정 ---
    ai_server_ip: "192.168.1.15"
    ai_server_port: 54321        # UDP 영상 전송 포트
    ai_healthcheck_port: 54321   # TCP 헬스체크 포트 (서버가 지원해야 함)
    rosbridge_port: 9090         # Main Server 접속용 웹소켓 포트
    
    # 헬스체크 실패해도 무조건 영상 전송 (True 권장)
    skip_stream_when_ai_dead: false

    # --- 2. 카메라 설정 (Camera Node) ---
    width: 640
    height: 480
    fps: 20
    # 카메라 장착 방향에 따른 보정
    hflip: true      # 좌우 반전
    vflip: true      # 상하 반전
    rotation: 0      # 회전 (0, 90, 180, 270)

    # --- 3. 실행 및 제어 설정 (Executor & Nav Handler) ---
    # 로봇 기본 정보
    robot_name: "pinky"
    robot_id: 1
    mock_mode: false
    execution_delay_sec: 1.5
    initial_battery: 100.0
    
    # 내비게이션(Nav2) 일반
    use_nav2: true
    nav2_action_name: "navigate_to_pose"
    frame_id: "map"
    goal_timeout_sec: 120.0
    goal_response_timeout_sec: 10.0
    nav2_success_status_code: 4
    nav2_feedback_log_period_sec: 1.5
    
    # 정지 및 안전 설정
    stop_cmd_vel_topic: "/cmd_vel"
    stop_publish_count: 10
    stop_publish_hz: 20.0
    safety_lock_topic: "safety_lock"
    ai_link_topic: "ai_link"
    include_ai_link_in_status: true
    
    # 내비게이션 실패 시 재시도 (Retry)
    nav2_retry_attempts: 3
    nav2_retry_delay_sec: 2.0
    nav2_abort_as_success_enabled: false
    nav2_abort_success_distance_tolerance: 0.35
    nav2_abort_success_error_codes: "103,106,208"
    
    # 위치 추정(Localization) 품질 관리
    localization_required: true
    amcl_pose_topic: "amcl_pose"
    odom_topic: "odom"
    amcl_pose_max_age_sec: 5.0
    amcl_pose_stale_check_enabled: true
    amcl_covariance_xy_max: 0.5
    amcl_covariance_yaw_max: 6.0
    localization_allow_degraded_covariance: true
    nav2_require_map_odom_tf: true
    nav2_tf_lookup_timeout_sec: 0.1
    
    # 위치 추정 복구 (Localization Recovery)
    localization_recovery_enabled: true
    localization_recovery_max_cycles: 2
    localization_recovery_cooldown_sec: 8.0
    localization_recovery_spin_duration_sec: 4.0
    localization_recovery_spin_angular_speed: 0.8
    global_localization_service_name: "reinitialize_global_localization"
    global_localization_wait_sec: 1.0
    amcl_nomotion_update_service_name: "request_nomotion_update"
    amcl_nomotion_wait_sec: 0.5
    localization_not_ready_event_name: "LOCALIZATION_NOT_READY"
    localization_not_ready_event_min_interval_sec: 2.0
    
    # Nav2 Lifecycle 관리
    nav2_lifecycle_check_enabled: true
    nav2_required_active_nodes: "planner_server,controller_server,bt_navigator,behavior_server"
    nav2_lifecycle_get_state_timeout_sec: 0.2
    nav2_lifecycle_reactivate_enabled: true
    nav2_lifecycle_manager_service_name: "lifecycle_manager_navigation/manage_nodes"
    nav2_lifecycle_manager_wait_sec: 1.0
    
    # 디스플레이 및 안내
    enable_display: true
    display_topic: "display"
    guide_display_period_sec: 2.0
    emit_command_received_event: true
    default_goto_success_event: "ARRIVED_AT_DESTINATION"
    
    # QR 스캔 설정
    qr_scan_local_enabled: true
    qr_scan_image_topic: "camera/image_raw/compressed"
    qr_scan_timeout_sec: 15.0
    qr_scan_poll_period_sec: 0.2
    
    # Always-on QR 스캔 (상시 감지)
    qr_always_scan_enabled: true
    qr_always_scan_event_name: "QR_DETECTED"
    qr_always_scan_poll_period_sec: 1.0
    qr_always_scan_min_interval_sec: 3.0
    
    # 배터리
    battery_topic: "battery/present"
