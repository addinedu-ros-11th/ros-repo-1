executor_node:
  ros__parameters:
    robot_name: "pinky_robot"
    robot_id: 1
    use_nav2: true
    mock_mode: false
    execution_delay_sec: 1.0
    initial_battery: 100.0
    battery_topic: "battery/present"
    nav2_action_name: "navigate_to_pose"
    frame_id: "map"
    goal_timeout_sec: 120.0
    goal_response_timeout_sec: 10.0
    safety_lock_topic: "safety_lock"
    ai_link_topic: "ai_link"
    include_ai_link_in_status: true
    nav2_retry_attempts: 3
    nav2_retry_delay_sec: 2.0
    localization_required: true
    amcl_pose_topic: "amcl_pose"
    odom_topic: "odom"
    amcl_pose_max_age_sec: 5.0
    amcl_covariance_xy_max: 0.5
    amcl_covariance_yaw_max: 1.0
    localization_recovery_enabled: true
    localization_recovery_max_cycles: 2
    display_topic: "display"
    qr_scan_local_enabled: true
    qr_scan_image_topic: "camera/image_raw/compressed"
    qr_scan_timeout_sec: 15.0
