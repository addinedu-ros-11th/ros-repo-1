<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Workspace</title>
    <link rel="stylesheet" href="../static/employee_style.css">
</head>

<body>

    <div class="container">
        <div class="panel reservation-panel">
            <h3>📅 방문 예약 및 현황</h3>
            <div class="res-form">
                <input type="text" id="res-name" class="res-input" placeholder="방문객 성함">
                <input type="text" id="res-purpose" class="res-input" placeholder="방문 목적">
                <input type="date" id="res-date" class="res-input">
                <input type="time" id="res-time" class="res-input"> 
                <input type="text" id="res-phone" class="res-input" 
                    placeholder="연락처 (010-0000-0000)" maxlength="13" oninput="autoHyphen(this)">
                <select id="res-location" class="res-input">
                    <option value="">목적지 선택 (선택 안함 시 host 위치)</option>
                </select>
                <button class="btn-submit" onclick="submitReservation()">방문 예약 등록</button>
            </div>

            <div class="res-list-container">
                <div class="res-list-header">
                    <h4>📋 내 예약 현황</h4>
                    <button type="button" class="btn-refresh" onclick="loadReservationTables()">
                        조회 🔄
                    </button>
                </div>
                <div class="table-wrapper">
                    <table class="res-table excel-style">
                        <thead>
                            <tr>
                                <th>방문객</th>
                                <th>연락처</th> 
                                <th>방문 목적</th>
                                <th>방문 날짜</th>
                                <th>방문 시간</th>
                                <th>상태</th>
                            </tr>
                        </thead>
                        <tbody id="res-table-body">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="panel combined-control-panel">
            <div class="res-list-header">
                <div class="control-section-title" style="margin: 0;">🤖 로봇 업무 수행 현황</div>
                <button class="btn-refresh btn-call-header" onclick="robotAction('call')">
                    로봇 호출 ⚡
                </button>
            </div>

            <div class="table-wrapper" style="margin-top: 10px; flex-grow: 1; overflow-y: auto;">
                <table class="res-table excel-style" id="robot-task-table">
                    <thead>
                        <tr>
                            <th>업무 유형</th> <th>상세 정보</th> <th>상태</th>    <th>관리</th>    </tr>
                    </thead>
                    <tbody id="robot-task-body">
                        <tr><td colspan="4" style="text-align:center; padding:20px;">데이터를 불러오는 중입니다...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="right-container">
            <div class="employee-info-bar">
                <div class="info-group">
                    <div class="info-item"><span class="info-tag">이름</span><span id="info-name">-</span></div>
                    <div class="info-item"><span class="info-tag">부서</span><span id="info-dept">-</span></div>
                    <div class="info-item"><span class="info-tag">직급</span><span id="info-role">-</span></div>
                    <div class="info-item"><span class="info-tag">사무실</span><span id="info-loc">-</span></div>
                    <div class="info-item"><span class="info-tag">입사일</span><span id="info-date">-</span></div>
                </div>
                <button class="logout-btn-new" onclick="logout()">로그아웃</button>
            </div>
            <div class="panel ai-assistant-section">
                <div class="chat-header">
                    <div class="ai-status"></div> AI Assistant
                </div>
                <div id="chat-messages">
                    <div class="message ai">무엇을 도와드릴까요?</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="user-input" placeholder="명령어를 입력하세요..." onkeypress="if(event.key==='Enter')sendMessage()">
                    <button onclick="sendMessage()" class="send-btn">전송</button>
                </div>
            </div>
        </div>

        <div id="notification-overlay">
            <div class="noti-content">
                <p id="noti-message"></p>
                <button onclick="handleNotification('accept')">수령 확인</button>
                <button onclick="handleNotification('reject')">거절</button>
            </div>
        </div>
    </div>

    <script>
        // 1. 모든 함수가 공통으로 사용할 쿠키 함수 (맨 위에 딱 한 번만!)
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null; // 못 찾으면 null 반환
        }

        // 2. 이름 가져오기 함수 (우리가 'name' 혹은 'user_id'로 합의한 것)
        function getLoggedInUserName() {
            // 백엔드에서 key="name"으로 구웠다면 'name'을 먼저 확인
            const name = getCookie('name');
            const id = getCookie('user_id'); // 이건 account 값
            
            // decodeURIComponent는 한글 깨짐 방지용입니다.
            return name ? decodeURIComponent(name) : (id || "미인증 사용자");
        }
        // # ---------------------------------------------------------
        // # 1. 인증 및 권한 확인 (Authentication & Security)
        // # ---------------------------------------------------------
        (function() {
            const cookies = document.cookie.split('; ').reduce((acc, cookie) => {
                const [key, value] = cookie.split('=');
                acc[key] = value;
                return acc;
            }, {});

            if (cookies['user_role'] !== 'STAFF' && cookies['user_role'] !== 'ADMIN') {
                alert("접근 권한이 없습니다.");
                window.location.href = "/";
            }
        })();

        function logout() {
            if (confirm("로그아웃 하시겠습니까?")) {
                document.cookie = "user_role=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
                alert("로그아웃 되었습니다.");
                window.location.href = "/";
            }
        }

        // # ---------------------------------------------------------
        // # 2. 로봇 업무 현황
        // # ---------------------------------------------------------

        async function loadMyRobotTasks() {
            const tbody = document.getElementById('robot-task-body');
            if (!tbody) return;

            try {
                const response = await fetch('/api/v1/employee/tasks/my');
                if (!response.ok) throw new Error("Failed to fetch tasks");
                
                const tasks = await response.json();
                console.log("실제 받은 Task 데이터:", tasks); // 디버깅용: 콘솔에서 status 값을 확인하세요

                if (tasks.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px;">수행 중인 업무가 없습니다.</td></tr>';
                    return;
                }

                tbody.innerHTML = ''; 
                tasks.forEach(task => {
                    const row = document.createElement('tr');
                    row.id = `task-${task.task_id}`;

                    const detailsText = task.details ? JSON.stringify(task.details) : "-";
                    
                    // 버튼 부분: 전용 클래스(robot-btn) 적용 및 인라인 스타일 제거
                    let actionHtml = `
                        <div style="display: flex; gap: 4px; justify-content: center;">
                            <button class="robot-btn btn-robot-confirm" 
                                onclick="updateTaskStatus('${task.task_id}', 'COMPLETED')">수령 확인</button>
                            <button class="robot-btn btn-robot-cancel" 
                                onclick="updateTaskStatus('${task.task_id}', 'CANCELLED')">취소</button>
                        </div>
                    `;

                    row.innerHTML = `
                        <td class="col-type">${task.task_type}</td>
                        <td class="col-details" title='${detailsText}'>${detailsText}</td>
                        <td class="col-status"><span class="status-badge">${task.status}</span></td>
                        <td class="col-action">${actionHtml}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (e) {
                console.error("로봇 작업 목록 로드 실패:", e);
            }
        }

        // 중복된 updateTaskStatus를 하나로 합치고 기능을 확정합니다.
        async function updateTaskStatus(taskId, newStatus) {
            const isCompleted = (newStatus === 'COMPLETED');
            const confirmMsg = isCompleted ? "수령 확인하시겠습니까?" : "취소하시겠습니까?";
            
            if (!confirm(confirmMsg)) return;

            try {
                const response = await fetch('/api/v1/employee/confirm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        task_id: parseInt(taskId),
                        // 백엔드 TaskManager/Repository의 수령 확인 액션은 'RECEIVE' 또는 'LOAD'입니다.
                        // 요구사항에 맞춰 COMPLETED로 수정하기 위해 'RECEIVE'를 보냅니다.
                        action_type: isCompleted ? 'RECEIVE' : 'CANCEL' 
                    })
                });
                
                const result = await response.json();
                if (response.ok && (result.status === 'success' || result.status === 'ok')) {
                    alert(isCompleted ? "수령 확인되었습니다." : "취소되었습니다.");
                    await loadMyRobotTasks(); // 목록 새로고침
                } else {
                    alert("처리 실패: " + (result.message || "권한이 없거나 상태를 변경할 수 없습니다."));
                }
            } catch (e) {
                console.error("상태 업데이트 실패:", e);
                alert("서버 통신 중 오류가 발생했습니다.");
            }
        }

        // # ---------------------------------------------------------
        // # 3. 방문 예약 시스템 (Reservation System)
        // # ---------------------------------------------------------
 
        // # 3-1. 유틸리티: 자동 하이픈 및 세션 정보 추출

        //전화번호 입력 시 자동으로 하이픈(-)을 삽입합니다.

        function autoHyphen(target) {
            target.value = target.value
                .replace(/[^0-9]/g, '')
                .replace(/^(\d{0,3})(\d{0,4})(\d{0,4})$/g, "$1-$2-$3")
                .replace(/(\-{1,2})$/g, "");
        }
        // # 3-2. 방문 예약 등록 로직 (보완본)
        async function submitReservation() {
            const vName = document.getElementById('res-name').value.trim();
            const vPurpose = document.getElementById('res-purpose').value.trim();
            const vDate = document.getElementById('res-date').value;
            const vTime = document.getElementById('res-time').value;
            const vPhone = document.getElementById('res-phone').value.trim().replace(/-/g, ''); // 하이픈 제거 후 숫자만 추출
            const vLocId = document.getElementById('res-location').value;

            // 1. 빈 칸 검사
            if (!vName || !vPurpose || !vDate || !vTime || !vPhone) {
                alert("모든 입력 칸을 채워주세요.");
                return;
            }

            // 2. 연락처 유효성 검사 (숫자만 & 11자리)
            const phoneRegex = /^[0-9]{11}$/;
            if (!phoneRegex.test(vPhone)) {
                alert("연락처는 숫자 11자리로 입력해주세요. (예: 01012345678)");
                return;
            }

            const data = {
                manager_account: getCookie('user_id'),
                manager_name: getLoggedInUserName(),
                visitor_name: vName,
                purpose: vPurpose,
                visit_date: vDate,
                visit_time: vTime,
                visitor_phone: vPhone 
            };

            if (vLocId) {
                data.destination_id = parseInt(vLocId);
            }

            try {
                const response = await fetch('/api/v1/employee/reservations/apply', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                if (result.status === 'success') {
                    alert("예약이 등록되었습니다.");
                    // 입력창 초기화
                    ['res-name', 'res-purpose', 'res-date', 'res-time', 'res-phone', 'res-location'].forEach(id => {
                        document.getElementById(id).value = '';
                    });
                    loadReservationTables(); // 목록 갱신
                }
            } catch (e) {
                alert("서버 통신 오류가 발생했습니다.");
            }
        }

        async function loadLocationOptions() {
            const select = document.getElementById('res-location');
            if (!select) return;

            try {
                const response = await fetch('/api/v1/employee/locations');
                const locations = await response.json();
                
                locations.forEach(loc => {
                    const opt = document.createElement('option');
                    opt.value = loc.location_id;
                    opt.textContent = `${loc.name} (${loc.type})`;
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error("목적지 목록 로드 실패:", e);
            }
        }

        async function loadReservationTables() {
            // 1. 함수가 실행되는 '지금 이 순간'의 쿠키를 다시 읽습니다.
            const userAccount = getCookie('user_id'); 
            const tbody = document.getElementById('res-table-body');
            const refreshBtn = document.querySelector('.btn-refresh');

            console.log("현재 브라우저가 인식한 유저 ID:", userAccount);

            if (!userAccount || !tbody) {
                console.error("사용자 계정 정보를 찾을 수 없습니다.");
                return;
            }

            if (refreshBtn) {
                refreshBtn.innerText = "조회 중... ⏳";
                refreshBtn.disabled = true;
            }

            try {
                // [수정 포인트] rejected 데이터를 가져오는 fetch를 추가했습니다.
                const [pending, approved, rejected] = await Promise.all([
                    fetch(`/api/v1/employee/reservations/pending?t=${Date.now()}`, { cache: 'no-store' }).then(r => r.json()),
                    fetch(`/api/v1/employee/reservations/approved?t=${Date.now()}`, { cache: 'no-store' }).then(r => r.json()),
                    fetch(`/api/v1/employee/reservations/rejected?t=${Date.now()}`, { cache: 'no-store' }).then(r => r.json())
                ]);

                // [수정 포인트] rejected를 포함하여 모든 데이터를 하나로 합칩니다.
                const allRes = [...pending, ...approved, ...rejected];
                console.log("서버에서 받은 전체 데이터 (반려 포함):", allRes);

                // 3. 필터링: 사용자님의 기존 로직 그대로 유지
                const myRes = allRes.filter(r => {
                    const dbAcc = String(r.manager_account || "").trim().toLowerCase();
                    const loginAcc = String(userAccount).trim().toLowerCase();
                    return dbAcc === loginAcc;
                });

                tbody.innerHTML = ''; 

                if (myRes.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px;">내 예약 내역이 없습니다.</td></tr>';
                } else {
                    myRes.forEach(res => {
                        const tr = document.createElement('tr');
                        
                        const p = res.phone || res.visitor_phone || ''; 
                        const fPhone = p.length === 11 ? `${p.slice(0,3)}-${p.slice(3,7)}-${p.slice(7)}` : p;
                        const vName = res.name || res.visitor_name || '';

                        let fTime = '-';
                        if (res.visit_time) {
                            fTime = String(res.visit_time).substring(0, 5);
                        }

                        // 사용자님의 상태 판별 로직 (데이터만 들어오면 REJECTED는 여기서 처리됨)
                        let sLabel = '대기중', sClass = 'status-pending';
                        if (res.status === 'APPROVED') { sLabel = '승인됨'; sClass = 'status-approved'; }
                        else if (res.status === 'CHECKED_IN') { sLabel = '입장완료'; sClass = 'status-approved'; }
                        else if (res.status === 'REJECTED') { sLabel = '반려됨'; sClass = 'status-rejected'; }
                        else if (res.status === 'EXPIRED') { sLabel = '만료됨'; sClass = 'status-rejected'; }

                        tr.innerHTML = `
                            <td>${vName}</td>
                            <td>${fPhone}</td>
                            <td>${res.purpose}</td>
                            <td>${res.visit_date}</td>
                            <td>${fTime}</td>
                            <td><span class="status-badge ${sClass}">${sLabel}</span></td>
                        `;
                        tbody.appendChild(tr);
                    });
                    console.log("테이블 갱신 완료: ", myRes.length, "건");
                }
            } catch (e) {
                console.error("데이터 로드 중 에러 발생:", e);
            } finally {
                if (refreshBtn) {
                    refreshBtn.innerText = "조회 🔄";
                    refreshBtn.disabled = false;
                }
            }
        }

        async function loadMyInfo() {
            try {
                const response = await fetch('/api/v1/employee/me');
                if (!response.ok) return;
                
                const data = await response.json();
                console.log("받은 정보:", data); // 브라우저 콘솔에서 확인용

                // 백엔드 return 키값과 HTML ID 매칭
                document.getElementById('info-name').innerText = data.name || "-";
                document.getElementById('info-dept').innerText = data.department || "-";
                document.getElementById('info-role').innerText = data.role || "-";
                document.getElementById('info-loc').innerText = data.location || "-";
                document.getElementById('info-date').innerText = data.created_at || "-";
            } catch (e) {
                console.error("내 정보 로드 중 오류:", e);
            }
        }

        // # ---------------------------------------------------------
        // # 4. AI Assistant 통신 및 알림 (정리된 버전)
        // # ---------------------------------------------------------
        
        // AI 발화 함수
        function aiSpeak(text) {
            appendMessage('ai', text);
        }

        // 메시지 전송 함수 (중복된 getCookie 삭제)
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;
            
            appendMessage('user', text);
            input.value = '';

            // 기존에 선언된 getCookie 함수를 사용합니다.
            const userId = getCookie('user_id') || 'unknown';

            try {
                const response = await fetch('/api/v1/employee/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: text,
                        user_id: userId 
                    })
                });
                
                const result = await response.json();
                if (result.status === 'success') {
                    let aiMsg = result.message;
                    if (result.ai_fields) {
                        aiMsg += `\n[분석 결과] 목적지: ${result.ai_fields.location || result.ai_fields.dest_location || '없음'}`;
                    }
                    aiSpeak(aiMsg);
                } else {
                    // 서버에서 반환한 구체적인 에러 메시지 출력
                    aiSpeak(result.message || "죄송합니다. 명령을 처리하는 중 문제가 발생했습니다.");
                }
            } catch (e) {
                aiSpeak("서버와 통신하는 중 오류가 발생했습니다.");
            }
        }

        function appendMessage(sender, text) {
            const chatMessages = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // # ---------------------------------------------------------
        // # 5. 실시간 상태 업데이트 (WebSocket - 하나만 선언)
        // # ---------------------------------------------------------
        let currentTaskData = null;
        const ws = new WebSocket(`ws://${location.host}/ws/admin/status`);

        ws.onmessage = function(event) {
            const message = JSON.parse(event.data);
            console.log("WS 수신:", message);
            
            // 작업 상태 업데이트 알림 (채팅창에 표시)
            if (message.event === "task_update") {
                aiSpeak(message.data.message);
            }
            // 로봇 수령 확인 알림 로직
            else if (message.event === "user_action_required") {
                showNotification(message.data);
            }
        };

        ws.onmessage = function(event) {
            const message = JSON.parse(event.data);
            console.log("WS 수신:", message);
            
            // 1. [공통] 작업 상태 업데이트 알림 (기존 기능: AI가 말해줌)
            if (message.event === "task_update") {
                const data = message.data;
                
                // (기존 기능) AI 음성 안내
                aiSpeak(data.message);

                // (신규 기능) 로봇 업무 수행 현황 테이블 업데이트
                const row = document.getElementById(`task-${data.task_id}`);
                if (row) {
                    const statusSpan = row.querySelector('.status-badge');
                    statusSpan.innerText = data.status;
                    
                    // 상태별 색상 클래스 변경
                    if (data.status === 'COMPLETED') statusSpan.className = 'status-badge status-approved';
                    else if (data.status === 'CANCELLED') statusSpan.className = 'status-badge status-rejected';
                    else statusSpan.className = 'status-badge status-pending';
                } else {
                    // 테이블에 없는 새로운 작업인 경우 행 추가
                    updateRobotTaskTable(data.task_id, data.message, data.status);
                }
            }
            
            // 2. [기존 기능] 로봇 수령 확인 알림 로직 (절대 삭제하면 안 됨)
            else if (message.event === "user_action_required") {
                showNotification(message.data);
            }
        };

        // [참고] 알림창 관련 UI가 HTML에 없다면 이 함수는 동작하지 않을 수 있습니다.
        function showNotification(data) {
            currentTaskData = data;
            const notiEl = document.getElementById('noti-message');
            if(notiEl) notiEl.innerText = data.message;
            const overlay = document.getElementById('notification-overlay');
            if(overlay) overlay.style.display = 'flex';
        }

        async function handleNotification(action) {
            if (!currentTaskData) return;
            document.getElementById('notification-overlay').style.display = 'none';

            if (action === 'accept') {
                try {
                    const response = await fetch('/api/v1/employee/confirm', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            task_id: currentTaskData.task_id,
                            action_type: currentTaskData.action_type
                        })
                    });
                    const result = await response.json();
                    aiSpeak(result.status === 'success' ? "확인되었습니다." : "오류가 발생했습니다.");
                } catch (e) {
                    aiSpeak("서버 통신 실패");
                }
            }
            currentTaskData = null;
        }

        async function initPage() {
            console.log("🚀 페이지 초기화 시작 (병렬 로드)");

            try {
                await Promise.all([
                    typeof loadMyInfo === 'function' ? loadMyInfo() : Promise.resolve(),
                    typeof loadReservationTables === 'function' ? loadReservationTables() : Promise.resolve(),
                    typeof loadMyRobotTasks === 'function' ? loadMyRobotTasks() : Promise.resolve()
                ]);

                // 2. 목적지 리스트는 함수 이름이 혼용될 수 있으니 별도 처리
                if (typeof loadLocationOptions === 'function') {
                    await loadLocationOptions();
                } else if (typeof loadLocations === 'function') {
                    await loadLocations();
                }

                console.log("✅ 모든 데이터 로드 완료");
            } catch (error) {
                console.error("❌ 초기화 중 오류 발생:", error);
            }
        }

        // DOM이 준비되면 실행
        window.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
