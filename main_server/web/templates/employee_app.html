<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Workspace</title>
    <link rel="stylesheet" href="../static/employee_style.css">
</head>

<body>

    <div class="container">
        <div class="panel reservation-panel">
            <h3 style="margin-top: 0;">📅 방문 예약 및 현황</h3>
            <div class="res-form">
                <input type="text" id="res-name" class="res-input" placeholder="방문객 성함">
                <input type="text" id="res-purpose" class="res-input" placeholder="방문 목적">
                <input type="date" id="res-date" class="res-input">
                <input type="time" id="res-time" class="res-input"> 
                <input type="text" id="res-phone" class="res-input full-width" 
                    placeholder="연락처 (010-0000-0000)" maxlength="13" oninput="autoHyphen(this)">
                <button class="btn-submit" onclick="submitReservation()">방문 예약 등록</button>
            </div>

            <div class="res-list-container">
                <h4>📋 내 예약 현황</h4>
                <div class="table-wrapper">
                    <table class="res-table excel-style">
                        <thead>
                            <tr>
                                <th>방문객</th>
                                <th>방문 목적</th>
                                <th>방문 날짜</th>
                                <th>방문 시간</th>
                                <th>진행 상태</th>
                            </tr>
                        </thead>
                        <tbody id="res-table-body">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="panel combined-control-panel">
            <div class="control-section-title">❄️ 공조 시스템 제어</div>
            <div class="remote-grid">
                <div class="temp-display">
                    <span id="temp-val">24°C</span>
                    <div class="wind-display" id="wind-display">
                        <div class="bar active"></div><div class="bar active"></div><div class="bar"></div><div class="bar"></div>
                    </div>
                </div>
                <button class="remote-btn btn-pwr">전원</button>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px;">
                    <button class="remote-btn" onclick="tempChange(1)">▲</button>
                    <button class="remote-btn" onclick="tempChange(-1)">▼</button>
                    <button class="remote-btn" onclick="windChange(1)">바람▲</button>
                    <button class="remote-btn" onclick="windChange(-1)">바람▼</button>
                </div>
            </div>
            
            <div class="control-section-title">🤖 로봇 기본 제어</div>
            <div class="robot-btn-group">
                <button class="ctrl-btn btn-call" onclick="robotAction('call')">로봇 호출</button>
                <button class="ctrl-btn btn-cancel" onclick="robotAction('cancel')">호출 취소</button>
            </div>
        </div>

        <div class="right-container">
            <div class="panel logout-section">
                <button class="btn-logout" onclick="logout()">로그아웃</button>
            </div>
            <div class="panel ai-assistant-section">
                <div class="chat-header">
                    <div class="ai-status"></div> AI Assistant
                </div>
                <div id="chat-messages">
                    <div class="message ai">무엇을 도와드릴까요?</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="user-input" placeholder="명령어를 입력하세요..." onkeypress="if(event.key==='Enter')sendMessage()">
                    <button onclick="sendMessage()" class="send-btn">전송</button>
                </div>
            </div>
        </div>
        
        <div id="notification-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
            <div style="background:white; padding:20px; border-radius:10px; text-align:center;">
                <p id="noti-message"></p>
                <button onclick="handleNotification('accept')">수령 확인</button>
                <button onclick="handleNotification('reject')">거절</button>
            </div>
        </div>
    </div>

    <script>
        // # ---------------------------------------------------------
        // # 1. 인증 및 권한 확인 (Authentication & Security)
        // # ---------------------------------------------------------
        (function() {
            const cookies = document.cookie.split('; ').reduce((acc, cookie) => {
                const [key, value] = cookie.split('=');
                acc[key] = value;
                return acc;
            }, {});

            if (cookies['user_role'] !== 'STAFF' && cookies['user_role'] !== 'ADMIN') {
                alert("접근 권한이 없습니다.");
                window.location.href = "/";
            }
        })();

        function logout() {
            if (confirm("로그아웃 하시겠습니까?")) {
                document.cookie = "user_role=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
                alert("로그아웃 되었습니다.");
                window.location.href = "/";
            }
        }

        // # ---------------------------------------------------------
        // # 2. 공조 및 로봇 제어 (IoT & Robot Control)
        // # ---------------------------------------------------------
        let currentTemp = 24;
        let windLevel = 2;

        function tempChange(val) {
            currentTemp += val;
            document.getElementById('temp-val').innerText = `${currentTemp}°C`;
            aiSpeak(`실내 온도를 ${currentTemp}도로 조정합니다.`);
        }

        function windChange(val) {
            windLevel = Math.max(0, Math.min(4, windLevel + val));
            const bars = document.getElementById('wind-display').children;
            for(let i=0; i<4; i++) bars[i].className = i < windLevel ? 'bar active' : 'bar';
            aiSpeak(`바람 세기를 ${windLevel}단계로 변경하였습니다.`);
        }

        function robotAction(type) {
            let msg = (type === 'call') ? "로봇을 호출하겠습니다." : "호출을 취소했습니다.";
            aiSpeak(msg);
        }

        // # ---------------------------------------------------------
        // # 3. 방문 예약 시스템 (Reservation System)
        // # ---------------------------------------------------------
 
        // # 3-1. 유틸리티: 자동 하이픈 및 세션 정보 추출

        //전화번호 입력 시 자동으로 하이픈(-)을 삽입합니다.

        function autoHyphen(target) {
            target.value = target.value
                .replace(/[^0-9]/g, '')
                .replace(/^(\d{0,3})(\d{0,4})(\d{0,4})$/g, "$1-$2-$3")
                .replace(/(\-{1,2})$/g, "");
        }

        // 특정 이름의 쿠키 값을 가져옵니다.
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
            return null;
        }

        // 쿠키에 저장된 name을 우선적으로 가져오고, 없으면 account를 반환합니다.
        function getLoggedInUserName() {
            const userName = getCookie('name'); 
            const userAccount = getCookie('user_id'); 
            
            if (userName) return userName;
            if (userAccount) return userAccount; 
            
            return "미인증 사용자";
        }
        // # 3-2. 방문 예약 등록 로직 (수정본)

        async function submitReservation() {
            const visitorName = document.getElementById('res-name').value;
            const purpose = document.getElementById('res-purpose').value;
            const visitDate = document.getElementById('res-date').value;
            const visitTime = document.getElementById('res-time').value;
            const visitorPhone = document.getElementById('res-phone').value;

            if (!visitorName || !visitDate) {
                aiSpeak("방문객 성함과 날짜를 입력해주세요.");
                return;
            }

            const data = {
                manager_account: getCookie('user_id'), // 쿠키에서 계정 정보 가져오기
                manager_name: getLoggedInUserName(),       // 쿠키에서 이름 가져오기
                visitor_name: visitorName,
                purpose: purpose,
                visit_date: visitDate,
                visit_time: visitTime,
                visitor_phone: visitorPhone
            };

            try {
                const response = await fetch('/api/v1/employee/reservations/apply', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                if (result.status === 'success') {
                    aiSpeak(`${visitorName} 고객님(담당: ${data.manager_name})의 예약이 신청되었습니다.`);
                    // 테이블 즉시 갱신 (이미 구현된 함수가 있다면 호출)
                    if(typeof loadReservationTables === 'function') loadReservationTables();
                }
            } catch (e) {
                aiSpeak("DB 연동 중 오류가 발생했습니다.");
            }
        }

       async function loadReservationTables() {
            const userAccount = getCookie('user_id');
            try {
                const [pendingRes, approvedRes] = await Promise.all([
                    fetch('/api/v1/employee/reservations/pending').then(res => res.json()),
                    fetch('/api/v1/employee/reservations/approved').then(res => res.json())
                ]);

                const allRes = [...pendingRes, ...approvedRes];
                const tbody = document.getElementById('res-table-body');
                tbody.innerHTML = '';

                allRes.filter(r => r.manager_account === userAccount).forEach(res => {
                    const tr = document.createElement('tr');
                    
                    // [수정] 방문 시간 포맷팅 (초 단위 숫자로 올 경우 처리)
                    let displayTime = res.visit_time || '-';
                    if (typeof res.visit_time === 'number') {
                        // 63360 같은 초 단위를 HH:MM 형식으로 변환
                        const hours = Math.floor(res.visit_time / 3600);
                        const minutes = Math.floor((res.visit_time % 3600) / 60);
                        displayTime = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
                    } else if (typeof res.visit_time === 'string' && res.visit_time.includes(':')) {
                        // '17:36:00' 형식을 '17:36'으로 자르기
                        displayTime = res.visit_time.substring(0, 5);
                    }

                    let statusLabel = '';
                    let statusClass = '';
                    if (res.status === 'PENDING') { statusLabel = '⏳ 대기중'; statusClass = 'status-pending'; }
                    else if (res.status === 'APPROVED') { statusLabel = '✅ 승인됨'; statusClass = 'status-approved'; }
                    else { statusLabel = '❌ 반려됨'; statusClass = 'status-rejected'; }

                    tr.innerHTML = `
                        <td>${res.visitor_name}</td>  <td>${res.purpose}</td>
                        <td>${res.visit_date}</td>
                        <td>${displayTime}</td>        <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error("예약 목록 로드 실패:", e);
            }
        }

        // 페이지 로드 시 실행
        window.onload = function() {
            loadReservationTables();
        };

        // # ---------------------------------------------------------
        // # 4. AI Assistant 통신 및 알림 (정리된 버전)
        // # ---------------------------------------------------------
        
        // AI 발화 함수
        function aiSpeak(text) {
            appendMessage('ai', text);
        }

        // 메시지 전송 함수 (중복된 getCookie 삭제)
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;
            
            appendMessage('user', text);
            input.value = '';

            // 기존에 선언된 getCookie 함수를 사용합니다.
            const userId = getCookie('user_id') || 'unknown';

            try {
                const response = await fetch('/api/v1/employee/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: text,
                        user_id: userId 
                    })
                });
                
                const result = await response.json();
                if (result.status === 'success') {
                    let aiMsg = result.message;
                    if (result.ai_fields) {
                        aiMsg += `\n[분석 결과] 목적지: ${result.ai_fields.location || result.ai_fields.dest_location || '없음'}`;
                    }
                    aiSpeak(aiMsg);
                } else {
                    aiSpeak("죄송합니다. 명령을 이해하지 못했습니다.");
                }
            } catch (e) {
                aiSpeak("서버와 통신하는 중 오류가 발생했습니다.");
            }
        }

        function appendMessage(sender, text) {
            const chatMessages = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // # ---------------------------------------------------------
        // # 5. 실시간 상태 업데이트 (WebSocket - 하나만 선언)
        // # ---------------------------------------------------------
        let currentTaskData = null;
        const ws = new WebSocket(`ws://${location.host}/ws/admin/status`);

        ws.onmessage = function(event) {
            const message = JSON.parse(event.data);
            console.log("WS 수신:", message);
            
            // 로봇 수령 확인 알림 로직
            if (message.event === "user_action_required") {
                showNotification(message.data);
            }
        };

        // [참고] 알림창 관련 UI가 HTML에 없다면 이 함수는 동작하지 않을 수 있습니다.
        function showNotification(data) {
            currentTaskData = data;
            const notiEl = document.getElementById('noti-message');
            if(notiEl) notiEl.innerText = data.message;
            const overlay = document.getElementById('notification-overlay');
            if(overlay) overlay.style.display = 'flex';
        }

        async function handleNotification(action) {
            if (!currentTaskData) return;
            document.getElementById('notification-overlay').style.display = 'none';

            if (action === 'accept') {
                try {
                    const response = await fetch('/api/v1/employee/confirm', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            task_id: currentTaskData.task_id,
                            action_type: currentTaskData.action_type
                        })
                    });
                    const result = await response.json();
                    aiSpeak(result.status === 'success' ? "확인되었습니다." : "오류가 발생했습니다.");
                } catch (e) {
                    aiSpeak("서버 통신 실패");
                }
            }
            currentTaskData = null;
        }
    </script>
</body>
</html>
