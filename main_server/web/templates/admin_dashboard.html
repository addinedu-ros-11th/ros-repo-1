<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 관제 시스템</title>
    <link rel="stylesheet" href="../static/admin_style.css">
</head>
<body>

    <div class="sidebar">
        <h2>관리자 메뉴</h2>
        <ul class="sidebar-menu">
            <li id="menu-robot-mgmt"  onclick="showTab('robot-mgmt')">🤖 로봇 관리</li>
            <li id="menu-office-mgmt" onclick="showTab('office-mgmt')">🏢 사무실 관리</li>
            <li id="menu-visitor-res" onclick="showTab('visitor-res')">📅 방문객 예약 현황</li>
            <li id="menu-sys-logs" onclick="showTab('sys-logs')">📜 시스템 동작 로그</li>
        </ul>
        <a href="javascript:void(0);" class="logout-btn" onclick="logout()">로그아웃</a>
    </div>

    <div class="main-content">
        <div id="robot-mgmt" class="tab-content">
            <h1>🤖 로봇 실시간 관제</h1>
            <div class="monitor-container" style="display: flex; gap: 20px;">
                <div class="map-section">
                    <div class="map-control-wrapper">
                        <button id="setup-btn" class="btn-zone-setup" onclick="toggleZoneSetup()">🚫 금지구역 설정: OFF</button>
                        <div id="map-container" 
                            onmousedown="handleMapMouseDown(event)" 
                            onmousemove="handleMapMouseMove(event)" 
                            onmouseup="handleMapMouseUp(event)"
                            onmouseleave="resetDragState()"> <div id="map-inner"></div>
                        </div>
                    </div>
                </div>
                <div class="robot-status-panel" style="flex: 1; background: white; padding: 20px; border-radius: 10px; border: 1px solid #ddd; height: fit-content;">
                    <h3>📊 로봇 상태</h3>
                    <div id="robot-list-container">
                        <!-- 로봇 상태 카드들이 여기 추가됨 -->
                        <div class="loading-msg">데이터 수신 중...</div>
                    </div>
                </div>
            </div>

            <div class="zone-management">
                <h3>📋 설정된 금지구역 리스트</h3>
                <table class="zone-table">
                    <thead><tr><th>ID</th><th>구역 이름</th><th>좌표 정보</th><th>관리</th></tr></thead>
                    <tbody id="zone-tbody"></tbody>
                </table>
            </div>
        </div>

        <div id="office-mgmt" class="tab-content" style="display:none;">
            <h2>🏢 사무실 관리 시스템</h2>
            <div class="office-grid">
                <div class="office-section">
                    <h3>📅 회의실 현황</h3>
                    <table class="data-table">
                        <thead><tr><th>회의실</th><th>상태</th><th>예약자</th><th>시간</th></tr></thead>
                        <tbody id="meeting-room-tbody"></tbody>
                    </table>
                </div>
                <div class="office-section">
                    <h3>🍿 간식 현황</h3>
                    <table class="data-table">
                        <thead><tr><th>품목명</th><th>수량</th><th>상태</th></tr></thead>
                        <tbody id="snack-status-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="visitor-res" class="tab-content" style="display:none;">
            <h2>📅 방문객 예약 관리</h2>
            <div class="office-section" style="margin-bottom: 30px; border: 2px solid #3498db; padding: 15px; border-radius: 10px; background: #ebf5fb;">
                <button type="button" class="btn-refresh" onclick="fetchVisitors()" style="padding: 10px 20px; background-color: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">
                    🔄 데이터 새로고침
                </button>
                <h3 style="color: #2980b9;">⏳ 승인 대기 목록 (신규 신청)</h3>
                <table class="data-table">
                    <thead>
                        <tr><th>방문객</th><th>목적</th><th>날짜</th><th>신청자</th><th>결정</th></tr>
                    </thead>
                    <tbody id="pending-visitor-list">
                        </tbody>
                </table>
            </div>
            <h3>✅ 최종 예약 확정 현황</h3>
            <table class="data-table">
                <thead>
                    <tr><th>방문날짜</th><th>방문시간</th><th>담당자</th><th>방문객</th></tr>
                </thead>
                <tbody id="visitor-list">
                    </tbody>
            </table>
        </div>

        <div id="sys-logs" class="tab-content" style="display:none;">
            <h2>📜 시스템 동작 로그</h2>
            <table class="data-table">
                <thead><tr><th>날짜</th><th>시간</th><th>로봇명</th><th>상태</th></tr></thead>
                <tbody id="log-list"></tbody>
            </table>
        </div>
    </div>

    <script>
        (function() {
            const getCookie = (name) => {
                const value = `; ${document.cookie}`;
                const parts = value.split(`; ${name}=`);
                if (parts.length === 2) return parts.pop().split(';').shift();
            };

            const userRole = getCookie('user_role');

            // 디버깅용: 쿠키가 제대로 읽히는지 콘솔에서 확인 가능
            console.log("현재 접속 유저 권한:", userRole);

            if (userRole !== 'ADMIN') {
                alert("접근 권한이 없습니다. 관리자로 로그인해주세요.");
                window.location.href = '/'; // 메인(로그인) 페이지로 이동
            }
        })();

        let isZoneSetupMode = false;
        let isDragging = false;
        let startX, startY;
        let currentZoneRect = null;
        
        // 맵 메타데이터 전역 변수
        let MAP_META = {
            resolution: 0.05,
            origin_x: 0.0,
            origin_y: 0.0,
            width: 0,
            height: 0
        };

        async function fetchMapMetadata() {
            try {
                const res = await fetch('/api/v1/admin/map/metadata');
                if (res.ok) {
                    MAP_META = await res.json();
                    console.log("맵 메타데이터 로드 완료:", MAP_META);
                }
            } catch (e) {
                console.error("메타데이터 로드 실패:", e);
            }
        }

        // 우클릭 방지 함수
        function preventRightClick(e) {
            e.preventDefault();
        }

        // 1. 버튼 활성화 토글
        function toggleZoneSetup() {
            isZoneSetupMode = !isZoneSetupMode;
            const btn = document.getElementById('setup-btn');
            const mapContainer = document.getElementById('map-container');
            
            if (isZoneSetupMode) {
                // 활성화 상태
                btn.innerText = "🚫 금지구역 설정: ON";
                btn.classList.add('on');
                mapContainer.style.cursor = "crosshair";

                // [추가] 활성화 시 우클릭 방지 이벤트 등록
                window.addEventListener('contextmenu', preventRightClick);
            } else {
                // 비활성화 상태
                btn.innerText = "🚫 금지구역 설정: OFF";
                btn.classList.remove('on');
                mapContainer.style.cursor = "default";

                // [추가] 비활성화 시 우클릭 방지 해제
                window.removeEventListener('contextmenu', preventRightClick);
            }
        }

        function resetDragState() {
            isDragging = false;
            if (currentZoneRect) {
                currentZoneRect.remove();
                currentZoneRect = null;
            }
        }

        // 2. 마우스 클릭 시작 (handleMapMouseDown 함수 내 수정)
        function handleMapMouseDown(event) {
            if (!isZoneSetupMode) return;
            
            // 혹시 남아있을지 모를 잔상 제거
            resetDragState();

            isDragging = true;
            const rect = event.currentTarget.getBoundingClientRect();
            startX = event.clientX - rect.left;
            startY = event.clientY - rect.top;

            currentZoneRect = document.createElement('div');
            currentZoneRect.className = 'temp-rect'; 
            currentZoneRect.style.left = `${startX}px`;
            currentZoneRect.style.top = `${startY}px`;
            document.getElementById('map-container').appendChild(currentZoneRect);
        }

        // 3. 마우스 드래그 중 (사각형 크기 조절)
        function handleMapMouseMove(event) {
            if (!isDragging || !currentZoneRect) return;

            const rect = event.currentTarget.getBoundingClientRect();
            
            // 지도 영역 내부로 좌표 강제 제한 (Clamping)
            let currentX = Math.max(0, Math.min(event.clientX - rect.left, rect.width));
            let currentY = Math.max(0, Math.min(event.clientY - rect.top, rect.height));

            const width = Math.abs(currentX - startX);
            const height = Math.abs(currentY - startY);
            
            currentZoneRect.style.width = `${width}px`;
            currentZoneRect.style.height = `${height}px`;
            currentZoneRect.style.left = `${Math.min(currentX, startX)}px`;
            currentZoneRect.style.top = `${Math.min(currentY, startY)}px`;
        }

        // 4. 마우스 뗌 (저장 팝업 및 API 호출)
        async function handleMapMouseUp(event) {
            if (!isDragging) return;

            const rect = event.currentTarget.getBoundingClientRect();
            const endX = Math.max(0, Math.min(event.clientX - rect.left, rect.width));
            const endY = Math.max(0, Math.min(event.clientY - rect.top, rect.height));

            // [핵심] prompt가 뜨기 전에 무조건 드래그 상태를 종료하고 임시 박스를 먼저 지웁니다.
            resetDragState();

            const zoneName = prompt("새로운 금지구역의 이름을 입력하세요:");
            
            if (!zoneName) return; // 취소 시 이미 박스는 위에서 지워졌으므로 남지 않음

            // [수정] 화면 좌표 -> 실제 좌표(meter) 변환 후 저장
            const p1 = screenToRealWorld(startX, startY);
            const p2 = screenToRealWorld(endX, endY);

            // 항상 좌상단(min), 우하단(max)으로 정렬하여 저장
            const payload = {
                name: zoneName,
                x1: Math.min(p1.x, p2.x), 
                y1: Math.min(p1.y, p2.y),
                x2: Math.max(p1.x, p2.x), 
                y2: Math.max(p1.y, p2.y),
                type: "forbidden"
            };
            
            try {
                const res = await fetch('/api/v1/admin/zones', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert("금지구역이 저장되었습니다.");
                    loadZones(); 
                }
            } catch (error) {
                console.error("저장 중 오류 발생:", error);
            }
        }
        
        async function loadZones() {
            try {
                const res = await fetch('/api/v1/admin/zones');
                const zones = await res.json();
                
                // 1. 지도 위 기존 구역 제거
                document.querySelectorAll('.no-go-zone').forEach(el => el.remove());
                
                // 2. 테이블 초기화
                const tbody = document.getElementById('zone-tbody');
                tbody.innerHTML = '';

                if (zones.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="empty-msg">등록된 금지구역이 없습니다.</td></tr>';
                    return;
                }

                zones.forEach(zone => {
                    // 데이터 유효성 검사 (좌표가 없으면 건너뛰기)
                    if (zone.x1 === undefined || zone.y1 === undefined || 
                        zone.x2 === undefined || zone.y2 === undefined) {
                        console.warn(`유효하지 않은 금지구역 데이터 (ID: ${zone.zone_id})`);
                        return;
                    }

                    // --- 지도에 박스 그리기 ---
                    // [수정] DB에 저장된 실제 좌표(meter)를 화면 좌표(px)로 변환
                    // zone.x1, y1 등은 이제 미터 단위임
                    const p1 = realWorldToScreen(zone.x1, zone.y1);
                    const p2 = realWorldToScreen(zone.x2, zone.y2);

                    const zoneDiv = document.createElement('div');
                    zoneDiv.className = 'no-go-zone';
                    
                    const left = Math.min(p1.x, p2.x);
                    const top = Math.min(p1.y, p2.y);
                    const width = Math.abs(p2.x - p1.x);
                    const height = Math.abs(p2.y - p1.y);
                    
                    zoneDiv.style.left = `${left}px`;
                    zoneDiv.style.top = `${top}px`;
                    zoneDiv.style.width = `${width}px`;
                    zoneDiv.style.height = `${height}px`;
                    zoneDiv.innerHTML = `<span>${zone.name || 'Unnamed'}</span>`; 

                    document.getElementById('map-container').appendChild(zoneDiv);

                    // --- 테이블에 리스트 추가 ---
                    const tr = document.createElement('tr');
                    
                    // 좌표값 안전하게 출력
                    const x1 = typeof zone.x1 === 'number' ? zone.x1.toFixed(2) : 'N/A';
                    const y1 = typeof zone.y1 === 'number' ? zone.y1.toFixed(2) : 'N/A';
                    const x2 = typeof zone.x2 === 'number' ? zone.x2.toFixed(2) : 'N/A';
                    const y2 = typeof zone.y2 === 'number' ? zone.y2.toFixed(2) : 'N/A';

                    tr.innerHTML = `
                        <td>${zone.zone_id}</td>
                        <td><strong>${zone.name || 'Unnamed'}</strong></td>
                        <td>(${x1}, ${y1}) ~ (${x2}, ${y2})</td>
                        <td><button class="btn-delete" onclick="deleteZone(${zone.zone_id})">삭제</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("구역 로드 실패:", error);
            }
        }

        async function deleteZone(zoneId) {
            // 1. 사용자 확인 팝업
            if (!confirm(`정말로 ${zoneId}번 금지구역을 삭제하시겠습니까?`)) {
                return;
            }

            try {
                // 2. 백엔드 DELETE 요청 전송
                const res = await fetch(`/api/v1/admin/zones/${zoneId}`, {
                    method: 'DELETE'
                });

                if (res.ok) {
                    alert("삭제되었습니다.");
                    // 3. 리스트 및 지도 새로고침
                    loadZones(); 
                } else {
                    const errorData = await res.json();
                    alert("삭제 실패: " + errorData.detail);
                }
            } catch (error) {
                console.error("삭제 중 오류 발생:", error);
                alert("서버와 통신하는 중 오류가 발생했습니다.");
            }
        }

        // admin_dashboard.html 내의 refreshMap 함수 수정
        async function refreshMap() {
            const mapInner = document.getElementById('map-inner');
            try {
                const response = await fetch('/api/v1/admin/map/image?t=' + new Date().getTime());
                if (response.ok) {
                    const blob = await response.blob();
                    const objectURL = URL.createObjectURL(blob);
                    
                    const img = document.createElement('img');
                    img.src = objectURL;
                    img.id = "real-map-img";
                    
                    // [추가] 브라우저의 기본 이미지 드래그 방지 (이벤트 락)
                    img.ondragstart = () => false; 
                    img.style.pointerEvents = "none"; 
                    
                    mapInner.innerHTML = ""; 
                    mapInner.appendChild(img);
                    
                    loadZones();
                } else {
                    mapInner.innerHTML = "<p style='color:red;'>이미지를 불러올 수 없습니다</p>";
                }
            } catch (error) {
                mapInner.innerHTML = "<p style='color:red;'>연결 오류</p>";
            }
        }

        /* 탭 전환 및 데이터 로드 트리거 */
        function showTab(tabId) {
            // 탭 전환 로직
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.sidebar-menu li').forEach(l => l.classList.remove('active'));
            
            const targetTab = document.getElementById(tabId);
            if (targetTab) targetTab.style.display = 'block';
            
            const targetMenu = document.getElementById('menu-' + tabId);
            if (targetMenu) targetMenu.classList.add('active');
            
            localStorage.setItem('activeTab', tabId);
            
            // 탭 이동 시 데이터 로드
            if(tabId === 'office-mgmt') fetchOfficeStatus();
            if(tabId === 'visitor-res') fetchVisitors(); // 여기서 호출
            if(tabId === 'sys-logs') fetchLogs();
        }

        /* 1. 사무실 관리 (회의실 & 간식) */
        async function fetchOfficeStatus() {
            const res = await fetch('/api/v1/admin/office-status');
            const data = await res.json();
            
            // 백엔드가 준 processed_rooms 그대로 출력
            document.getElementById('meeting-room-tbody').innerHTML = data.rooms.map(room => `
                <tr>
                    <td>${room.name}</td>
                    <td><span class="status-badge ${room.status === '사용 중' ? 'busy' : 'free'}">${room.status}</span></td>
                    <td>${room.user}</td>
                    <td>${room.time}</td>
                </tr>
            `).join('');

            // 백엔드가 준 snacks 그대로 출력
            document.getElementById('snack-status-tbody').innerHTML = data.snacks.map(snack => `
                <tr>
                    <td>${snack.name}</td>
                    <td>${snack.quantity}</td>
                    <td><b style="color: ${snack.status === '부족' ? '#e74c3c' : '#2ecc71'}">${snack.status}</b></td>
                </tr>
            `).join('');
        }

        /* 2. 방문객 예약 현황 */
        let isFetching = false; 

        async function fetchVisitors() {
            if (isFetching) return;
            isFetching = true;
            
            try {
                const res = await fetch('/api/v1/admin/visitors');
                const data = await res.json();
                
                const pendingBody = document.getElementById('pending-visitor-list');
                const confirmedBody = document.getElementById('visitor-list');

                // 승인 대기 목록 (PENDING만)
                const pendingHtml = data.pending
                    .filter(v => v.status === 'PENDING') // 3중 방어: PENDING만 출력
                    .map(v => `
                        <tr>
                            <td>${v.visitor}</td>
                            <td>${v.purpose}</td>
                            <td>${v.date}</td>
                            <td>${v.host}</td>
                            <td>
                                <button class="btn-approve" onclick="updateStatus(${v.id}, 'APPROVED')">승인</button>
                                <button class="btn-reject" onclick="updateStatus(${v.id}, 'REJECTED')">반려</button>
                            </td>
                        </tr>
                    `).join('');
                
                pendingBody.innerHTML = pendingHtml || '<tr><td colspan="5">대기 중인 신청이 없습니다.</td></tr>';

                // 확정 목록 (APPROVED만)
                const confirmedHtml = data.confirmed.map(v => `
                    <tr>
                        <td>${v.date}</td>
                        <td>${v.time || '-'}</td>
                        <td>${v.host}</td>
                        <td>${v.visitor}</td>
                    </tr>
                `).join('');
                
                confirmedBody.innerHTML = confirmedHtml || '<tr><td colspan="4">확정된 예약이 없습니다.</td></tr>';

            } catch (e) {
                console.error("로드 실패:", e);
            } finally {
                isFetching = false;
            }
        }

        // 상태 업데이트 함수
        async function updateStatus(resId, status) {
            if (!confirm(`예약을 ${status === 'APPROVED' ? '승인' : '반려'}하시겠습니까?`)) return;

            try {
                const response = await fetch('/api/v1/admin/reservations/decision', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: resId, status: status })
                });

                if (response.ok) {
                    alert("처리가 완료되었습니다.");
                    // 버튼 연타를 방지하기 위해 isFetchingVisitors를 초기화하고 강제 호출
                    isFetchingVisitors = false; 
                    await fetchVisitors(); 
                } else {
                    alert("처리에 실패했습니다.");
                }
            } catch (error) {
                alert("통신 오류가 발생했습니다.");
            }
        }

        /* 3. 시스템 로그 */
        async function fetchLogs() {
            const res = await fetch('/api/v1/admin/logs');
            const logs = await res.json();
            
            // 백엔드가 포맷팅까지 끝낸 logs 그대로 출력
            document.getElementById('log-list').innerHTML = logs.map(log => `
                <tr>
                    <td>${log.date}</td>
                    <td>${log.time}</td>
                    <td>${log.robot_name}</td>
                    <td><span class="log-badge ${log.status.toLowerCase()}">${log.status}</span></td>
                </tr>
            `).join('');
        }

        /* 로그아웃 시 탭 저장 정보 삭제 */
        function logout() {
            // 1. 쿠키 삭제 (만료일을 과거로 설정하여 브라우저가 버리게 함)
            document.cookie = "user_role=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            
            // 2. 필요하다면 세션 스토리지나 로컬 스토리지도 비움
            localStorage.clear();
            
            // 3. 로그인 창으로 이동
            alert("로그아웃 되었습니다.");
            window.location.href = "/";
        }

        async function updateRobotMarkers() {
            try {
                const res = await fetch('/api/v1/admin/robots/telemetry');
                const robots = await res.json();
                
                const mapInner = document.getElementById('map-inner');
                const mapImg = document.getElementById('real-map-img'); 
                const listContainer = document.getElementById('robot-list-container');
                
                if (!mapImg || mapImg.naturalWidth === 0) return;

                // 화면상 지도 너비(1000px) / 원본 너비 비율 계산
                const scale = mapImg.clientWidth / mapImg.naturalWidth;

                // 기존 로봇 마커 삭제
                document.querySelectorAll('.robot-marker').forEach(el => el.remove());

                // 로봇 리스트 HTML 생성
                let listHtml = "";

                robots.forEach(robot => {
                    // --- 1. 지도상 마커 표시 ---
                    const marker = document.createElement('div');
                    marker.className = `robot-marker ${robot.status.toLowerCase()}`;
                    
                    // 백엔드가 이미 픽셀 좌표(raw_px, raw_py)를 계산해서 줌
                    // (admin_routes.py에서 PathPlanner 정보를 썼기 때문에 정확함)
                    // 화면 배율만 적용하면 됨
                    const finalX = robot.px * scale;
                    const finalY = robot.py * scale;

                    marker.style.left = `${finalX}px`;
                    marker.style.top = `${finalY}px`;
                    
                    // 마커에 툴팁 추가
                    marker.innerHTML = `
                        <div class="robot-label">${robot.name}</div>
                        <div class="robot-tooltip">
                            🔋 ${Math.round(robot.battery)}% <br>
                            Status: ${robot.status}
                        </div>
                    `;
                    mapInner.appendChild(marker);

                    // --- 2. 우측 패널 리스트 업데이트 ---
                    const batteryColor = robot.battery > 20 ? '#2ecc71' : '#e74c3c';
                    const statusClass = robot.status === 'ERROR' ? 'error' : (robot.status === 'MOVING' ? 'moving' : 'idle');
                    
                    listHtml += `
                        <div class="robot-card" style="border-left: 5px solid ${robot.status === 'ERROR' ? '#e74c3c' : '#3498db'}; margin-bottom: 10px; padding: 10px; background: #f9f9f9; border-radius: 5px;">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <strong style="font-size: 1.1em;">${robot.name}</strong>
                                <span class="status-badge ${statusClass}">${robot.status}</span>
                            </div>
                            <div style="margin-top: 5px; font-size: 0.9em; color: #555;">
                                <div>Task ID: ${robot.current_task_id || '-'}</div>
                                <div style="display:flex; align-items:center; gap: 5px; margin-top: 3px;">
                                    <span>🔋</span>
                                    <div style="flex:1; background:#ddd; height:8px; border-radius:4px; overflow:hidden;">
                                        <div style="width:${robot.battery}%; background:${batteryColor}; height:100%;"></div>
                                    </div>
                                    <span>${Math.round(robot.battery)}%</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                if (robots.length === 0) {
                    listContainer.innerHTML = "<div class='empty-msg'>연결된 로봇이 없습니다.</div>";
                } else {
                    listContainer.innerHTML = listHtml;
                }

            } catch (e) {
                console.error("관제 데이터 로드 실패:", e);
            }
        }

        // 1초마다 실행
        setInterval(updateRobotMarkers, 1000);

        // 실제 좌표(meter) -> 화면 픽셀(px) 변환
        function realWorldToScreen(realX, realY) {
            const mapImg = document.getElementById('real-map-img');
            // 이미지가 아직 로드되지 않았으면 0,0 반환
            if (!mapImg || mapImg.naturalWidth === 0) return { x: 0, y: 0 };

            const scale = mapImg.clientWidth / mapImg.naturalWidth; // 확대 배율
            
            const RESOLUTION = MAP_META.resolution || 0.05;
            const ORIGIN_X = MAP_META.origin_x || 0.0;
            const ORIGIN_Y = MAP_META.origin_y || 0.0;
            const IMG_H = MAP_META.height || 0; 

            // 1. 실제 미터 -> 원본 이미지 픽셀
            // realX = (rawPx * RESOLUTION) + ORIGIN_X
            // => rawPx = (realX - ORIGIN_X) / RESOLUTION
            const rawPx = (realX - ORIGIN_X) / RESOLUTION;
            
            // realY = ((IMG_H - rawPy) * RESOLUTION) + ORIGIN_Y
            // => (realY - ORIGIN_Y) / RESOLUTION = IMG_H - rawPy
            // => rawPy = IMG_H - ((realY - ORIGIN_Y) / RESOLUTION)
            const rawPy = IMG_H - ((realY - ORIGIN_Y) / RESOLUTION);

            // 2. 원본 이미지 픽셀 -> 화면 픽셀
            const screenX = rawPx * scale;
            const screenY = rawPy * scale;

            return { x: screenX, y: screenY };
        }

        // 금지구역 저장 시 좌표 변환 함수
        function screenToRealWorld(screenX, screenY) {
            const mapImg = document.getElementById('real-map-img');
            const scale = mapImg.clientWidth / mapImg.naturalWidth; // 확대 배율
            
            // 전역 변수 MAP_META 사용
            // 없을 경우 기본값(Fallback) 사용
            const RESOLUTION = MAP_META.resolution || 0.05;
            const ORIGIN_X = MAP_META.origin_x || 0.0;
            const ORIGIN_Y = MAP_META.origin_y || 0.0;
            const IMG_H = MAP_META.height || 0; // 이미지 높이 (픽셀)

            // 1. 화면 픽셀 -> 원본 이미지 픽셀
            const rawPx = screenX / scale;
            const rawPy = screenY / scale;

            // 2. 원본 이미지 픽셀 -> 실제 미터 좌표 (역산)
            // py = height - ((y - origin_y) / resolution)
            // => (height - py) = (y - origin_y) / resolution
            // => y = (height - py) * resolution + origin_y
            
            const realX = (rawPx * RESOLUTION) + ORIGIN_X;
            const realY = ((IMG_H - rawPy) * RESOLUTION) + ORIGIN_Y;

            return { x: realX, y: realY };
        }

        /* 페이지 로드 시 자동으로 로봇 관리 탭 실행 */
        window.onload = function() {
            // 1. 브라우저 창고에서 이전에 보던 탭이 있는지 확인
            const lastTab = localStorage.getItem('activeTab');
            
            // 2. 보던 탭이 있으면 그 탭을 열고, 없으면 기본값인 'robot-mgmt'를 엶
            if (lastTab && document.getElementById(lastTab)) {
                showTab(lastTab);
            } else {
                showTab('robot-mgmt');
            }
            
            // window.onload에 추가
            console.log("페이지 로드 완료 - 지도 불러오기 시작"); // 확인용 로그
            fetchMapMetadata(); // 메타데이터 로드
            refreshMap();
        };
    </script>
