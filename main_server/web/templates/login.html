<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>시스템 로그인</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .error { color: red; font-size: 0.9em; text-align: center; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>로봇 시스템</h2>
        <form>
            <input type="text" name="username" placeholder="아이디" required>
            <input type="password" name="password" placeholder="비밀번호" required>
            <button type="submit">로그인</button>
        </form>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </div>

    <script>
        (function checkAlreadyLoggedIn() {
            const cookies = document.cookie.split('; ').reduce((acc, cookie) => {
                const [key, value] = cookie.split('=');
                acc[key] = value;
                return acc;
            }, {});

            const role = cookies['user_role'];

            // 이미 쿠키가 있다면 역할에 맞춰 자동 이동
            if (role === 'ADMIN') {
                window.location.href = "/admin";
            } else if (role === 'STAFF') {
                window.location.href = "/employee";
            }
        })();

        // form의 submit 이벤트를 가로채서 처리하는 스크립트 예시
        const loginForm = document.querySelector('form'); // form 요소 선택 추가

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // 기본 submit 동작 방지

            const formData = new FormData(loginForm);
            const response = await fetch('/api/v1/login', { // 주소 확인
                method: 'POST',
                body: formData
            });
            
            const result = await response.json();

            if (response.ok && result.status === "success") {
                // [추가된 부분] 로그인이 성공했으므로 사용자 정보를 쿠키에 저장합니다.
                // result 내에 user 정보가 포함되어 있다고 가정합니다 (name, account 등)
                if (result.user) {
                    document.cookie = `user_name=${encodeURIComponent(result.user.name)}; path=/`;
                    document.cookie = `user_account=${result.user.account}; path=/`;
                }
                
                if (result.role === "ADMIN") {
                    // 주소를 /admin으로 정확히 수정!
                    window.location.href = "/admin"; 
                } else {
                    window.location.href = "/employee";
                }
            }
        });
    </script>
</body>
</html>
