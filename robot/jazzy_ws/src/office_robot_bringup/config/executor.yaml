office_robot_executor:
  ros__parameters:
    robot_name: robot01
    robot_id: 1
    mock_mode: false
    use_nav2: true
    execution_delay_sec: 1.5
    initial_battery: 0.0
    battery_topic: /battery/present
    nav2_action_name: navigate_to_pose
    frame_id: map
    goal_timeout_sec: 60.0
    goal_response_timeout_sec: 8.0
    stop_cmd_vel_topic: /cmd_vel
    stop_publish_count: 10
    stop_publish_hz: 20.0
    safety_lock_topic: safety_lock
    safety_state_topic: safety_state
    ai_link_topic: ai_link
    include_ai_link_in_status: true
    nav2_abort_as_success_enabled: true
    nav2_abort_success_distance_tolerance: 0.35
    nav2_abort_success_error_codes: "103,106,208"
    nav2_retry_attempts: 8
    nav2_retry_delay_sec: 1.0
    forward_first_enabled: true
    forward_first_max_sec: 5.0
    forward_first_stuck_timeout_sec: 2.5
    forward_first_min_progress_m: 0.08
    forward_first_controller_node: controller_server
    forward_first_allow_reversing_param: FollowPath.allow_reversing
    robot_yield_right_enabled: true
    robot_yield_right_offset_m: 0.08
    robot_yield_right_forward_m: 0.18
    robot_yield_right_cooldown_sec: 5.0
    robot_yield_right_max_attempts_per_action: 2
    obstacle_slow_enabled: true
    obstacle_slow_controller_node: controller_server
    obstacle_slow_linear_vel_param: FollowPath.desired_linear_vel
    obstacle_slow_linear_vel: 0.06
    obstacle_auto_resume_enabled: true
    obstacle_auto_resume_delay_sec: 0.6
    dynamic_nav_profile_enabled: false
    dynamic_nav_profile_scan_topic: /scan
    dynamic_nav_profile_robot_width_m: 0.12
    dynamic_nav_profile_side_arc_center_deg: 82.0
    dynamic_nav_profile_side_arc_half_width_deg: 6.0
    dynamic_nav_profile_forward_arc_half_width_deg: 12.0
    dynamic_nav_profile_percentile: 0.10
    dynamic_nav_profile_wide_width_enter_m: 0.44
    dynamic_nav_profile_wide_width_exit_m: 0.34
    dynamic_nav_profile_wide_min_side_clear_enter_m: 0.15
    dynamic_nav_profile_wide_min_side_clear_exit_m: 0.10
    dynamic_nav_profile_forward_enter_m: 0.70
    dynamic_nav_profile_forward_exit_m: 0.45
    dynamic_nav_profile_enter_samples: 4
    dynamic_nav_profile_exit_samples: 2
    dynamic_nav_profile_wide_lookahead_dist: 0.32
    dynamic_nav_profile_wide_min_lookahead_dist: 0.15
    dynamic_nav_profile_wide_max_lookahead_dist: 0.40
    dynamic_nav_profile_wide_rotate_to_heading_min_angle: 0.45
    localization_required: true
    amcl_pose_topic: amcl_pose
    odom_topic: /odom
    amcl_pose_max_age_sec: 3.0
    amcl_pose_stale_check_enabled: false
    amcl_covariance_xy_max: 0.8
    amcl_covariance_yaw_max: 6.0
    localization_allow_degraded_covariance: true
    nav2_require_map_odom_tf: true
    nav2_tf_lookup_timeout_sec: 0.05
    localization_recovery_enabled: true
    localization_recovery_max_cycles: 2
    localization_recovery_cooldown_sec: 8.0
    localization_recovery_spin_duration_sec: 8.0
    localization_recovery_spin_angular_speed: 0.8
    global_localization_service_name: reinitialize_global_localization
    global_localization_wait_sec: 0.5
    amcl_nomotion_update_service_name: request_nomotion_update
    amcl_nomotion_wait_sec: 0.3
    startup_localization_bootstrap_enabled: true
    startup_localization_bootstrap_delay_sec: 2.0
    startup_localization_bootstrap_recheck_sec: 6.0
    startup_localization_bootstrap_max_cycles: 3
    startup_initial_pose_enabled: false
    startup_initial_pose_topic: initialpose
    startup_initial_pose_delay_sec: 1.0
    startup_initial_pose_x: 0.0
    startup_initial_pose_y: 0.0
    startup_initial_pose_yaw: 0.0
    startup_initial_pose_covariance_xy: 0.25
    startup_initial_pose_covariance_yaw: 0.5
    manual_initial_pose_refine_enabled: false
    manual_initial_pose_refine_cooldown_sec: 3.0
    manual_initial_pose_refine_ignore_self_sec: 1.0
    nav2_lifecycle_check_enabled: true
    nav2_required_active_nodes: planner_server,controller_server,bt_navigator,behavior_server
    nav2_lifecycle_get_state_timeout_sec: 0.15
    nav2_lifecycle_state_stale_sec: 3.0
    nav2_lifecycle_reactivate_enabled: true
    nav2_lifecycle_manager_service_name: lifecycle_manager_navigation/manage_nodes
    nav2_lifecycle_manager_wait_sec: 0.5
    localization_not_ready_event_name: LOCALIZATION_NOT_READY
    localization_not_ready_event_min_interval_sec: 2.0
    enable_display: true
    display_topic: display
    led_topic: led_command
    idle_led_off_enabled: true
    employee_verification_enabled: false
    employee_verification_topic: employee_verification
    employee_verification_min_confidence: 0.5
    employee_verification_greeting_text: "Hello, employee"
    employee_verification_feedback_hold_sec: 5.0
    employee_verification_cooldown_sec: 5.0
    employee_verification_qr_fallback_enabled: true
    employee_verification_qr_prompt_text: "QR 코드를 인증해주세요"
    employee_verification_qr_on_success_event: "QR_SCANNED"
    employee_verification_qr_purpose: "VISITOR_SCAN"
    guide_display_period_sec: 2.0
    guide_follow_monitor_enabled: true
    guide_follow_scan_topic: /scan
    guide_follow_rear_center_deg: 180.0
    guide_follow_rear_half_width_deg: 20.0
    guide_follow_acquire_min_distance_m: 0.45
    guide_follow_acquire_max_distance_m: 0.90
    guide_follow_keep_min_distance_m: 0.35
    guide_follow_keep_max_distance_m: 1.20
    guide_follow_min_points: 5
    guide_follow_min_cluster_width_m: 0.12
    guide_follow_max_cluster_width_m: 0.75
    guide_follow_acquire_confirm_sec: 0.8
    guide_follow_lost_confirm_sec: 1.5
    guide_follow_wait_display_text: "뒤따라와 주세요"
    emit_command_received_event: true
    qr_scan_local_enabled: true
    qr_scan_image_topic: /camera/image_raw/compressed
    qr_scan_timeout_sec: 15.0
    qr_scan_poll_period_sec: 0.2
    qr_scan_min_dwell_sec: 1.5
    qr_scan_confirm_count: 2
    qr_scan_ignore_commands_while_active: true
    qr_scan_failure_display_text: "인증 실패"
    qr_scan_failure_display_hold_sec: 2.0
    qr_scan_not_detected_display_text: "QR 코드가 보이지 않습니다"
    qr_scan_decode_failed_display_text: "QR 코드를 읽지 못했습니다"
    qr_always_scan_enabled: false
    qr_always_scan_event_name: QR_DETECTED
    qr_always_scan_poll_period_sec: 0.5
    qr_always_scan_min_interval_sec: 3.0
    default_goto_success_event: ARRIVED_AT_DESTINATION
